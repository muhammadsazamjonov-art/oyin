services:
  - type: web
    name: oltin-qarmoq
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oltin-qarmoq-db
          property: connectionString

databases:
  - name: oltin-qarmoq-db
    databaseName: oltin_qarmoq
    user: oltin_qarmoq
    plan: free
